[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carnet"
version = "0.1.0"
description = "CAN/DoIP in-vehicle network simulation with rule-based intrusion detection"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.6",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "pytest>=8.0",
    "flask>=3.1",
    "scikit-learn>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]